name: Build and Release

on:
  push:
    tags:
      - 'v*'  # v1.0.0 형태의 태그가 푸시되면 실행
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build .exe with PyInstaller
      run: |
        python -m PyInstaller excel_merger.spec

    - name: Verify build
      run: |
        if (Test-Path "dist\ExcelMerger.exe") {
          Write-Host "✅ ExcelMerger.exe created successfully"
          $size = (Get-Item "dist\ExcelMerger.exe").Length
          Write-Host "File size: $size bytes"
        } else {
          Write-Error "❌ ExcelMerger.exe not found!"
          exit 1
        }

    - name: Install Inno Setup
      run: |
        choco install innosetup -y

    - name: Build installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Upload ExcelMerger.exe
      uses: actions/upload-artifact@v4
      with:
        name: ExcelMerger-exe
        path: dist/ExcelMerger.exe

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: ExcelMerger-Setup
        path: installer_output/ExcelMerger_Setup.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/ExcelMerger.exe
          installer_output/ExcelMerger_Setup.exe
        body: |
          ## Excel Merger Release

          ### 다운로드

          - **ExcelMerger_Setup.exe**: 설치 프로그램 (권장)
          - **ExcelMerger.exe**: 단독 실행 파일

          ### 설치 방법

          1. `ExcelMerger_Setup.exe` 다운로드
          2. 더블클릭하여 설치
          3. 시작 메뉴에서 "Excel Merger" 실행

          ### 시스템 요구사항

          - Windows 10 이상
          - 4GB RAM

          자세한 내용은 [USER_GUIDE.md](https://github.com/${{ github.repository }}/blob/main/USER_GUIDE.md)를 참고하세요.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
